# Practical 11: Multi-Container Orchestration with Docker Compose
services:
  mongodb:
    image: mongo:7.0
    container_name: practical11-mongodb-1
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - awdf-mongodb-data-practical11:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: practical11-backend-1
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskdb_docker
      - JWT_SECRET=awdf_secret_key_24cs104
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: practical11-frontend-1
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  awdf-mongodb-data-practical11:
    name: awdf-mongodb-data-practical11

networks:
  app-network:
    driver: bridge
    name: practical11_app-network
